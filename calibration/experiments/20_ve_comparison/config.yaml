# Exp 20 — VE comparison over the two model posteriors (Phase B; downstream of the locked 18/19 posteriors).
method: paired-seed posterior-predictive vaccine simulation
driver: ve_compare.py
vaccine: 2-dose VaccinePrime (doses at 2 & 4 mo); each seroconversion +1 infection-equivalent (up to +2)  # reused from exp 15
inputs:
  - ../18_age_posterior/outputs/posterior.csv
  - ../19_infnum_posterior/outputs/posterior.csv
n_ve_draws: 800            # unique posterior draws per model (resampling duplicates collapsed)
response: 0.75             # fixed; can sweep 0.6/0.75/0.9 later
n_agents: 40000
seed_scheme: paired -- baseline & vaccinated of draw i BOTH use seed = 30000 + i (common random numbers)
metric: VE = 1 - IR_symp(vax)/IR_symp(novax), overall AND by age bin (<=36mo)
outputs: [outputs/{model}_ve_draws.csv, outputs/{model}_ve_summary.json]
machines: age->raccoon, infnum->covaguest (pinned env; ../../hm_env_pins.txt)
status: SCAFFOLDED -- awaiting exp 18/19 posteriors; NOT yet launched
open_decisions: [VE metric (overall vs by-age vs direct-effect), response (fix 0.75 vs sweep), N_VE vs ESS]
