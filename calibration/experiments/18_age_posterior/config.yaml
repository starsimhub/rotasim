# Exp 18 — trajectory-selection posterior for age+titer (importance resampling on the exp-16 NROY).
model: age
method: trajectory_selection
driver: ../../trajectory_select.py
n_nroy_draws: 5000
n_agents: 40000
observation: cohort
seed_scheme: fixed per draw, seed = 20260611 + idx (deterministic; NROY draw cached to outputs/nroy_draw.csv)
likelihood:
  ir_by_age: Poisson(cases | lambda = IR/100 * PT)   # bins <6m, 6-11m, 12-23m
  repeat_detected_frac: Binomial(obs | n)
  first_infection: censored-survival LL over all (age, event) records vs model KM survival
  ever_detected: EXCLUDED   # marginal of the survival data -> would double-count (agreed 2026-06-11)
hm_checkpoint: ../16_hm_age_titer/outputs/hm/maled_age_titer/checkpoint.pkl
machine: raccoon (pinned env; ../../hm_env_pins.txt)
outputs: [outputs/nroy_draw.csv, outputs/sir_results.jsonl, outputs/posterior.csv, outputs/ts_stats.json]
compare_against: ../19_infnum_posterior
