# Exp 11 — infection-number symptoms + TITER maternal, isolated test.
# Same homogeneous mixing + process_model observation as exp 09/10 (no reservoir, no
# cohort/detection emulation, no EIA sampling) so it's apples-to-apples with the Erlang
# baselines. Only change vs exp 09/10 infnum arm: maternal model erlang -> titer.
site: bangladesh
symptom_model: infection_number      # fitted p_symp_1>=p_symp_2>=p_symp_3+ (same as exp 06/08/09)
maternal_model: titer                # D. Klein IBM titer maternal (fitted)
fit_target: poisson
n_trials: 40
n_reps: 20
n_jobs: 1
n_agents: 100000
demographics: bangladesh
mixing: homogeneous                  # RandomNet n_contacts=7 (NO reservoir levers)
observation: process_model           # symptomatic ~100%, p_asymp_detect=0.4 (same as 09/10)
denominator: PersonTimeByAge
study: rota_maled_bangladesh_infnum_titer_poisson
db: rota_maled_bangladesh_infnum_titer_poisson.db
# Fitted titer priors (match DK exp-06): median 4-60 (log, IC50), gsd 1.3-3.5,
# half_life 25-70 d, hill_slope 1.5-8. Seeded near DK's best (median 41/hl 68/gsd 2.6/hill 6.2).
seed: near DK exp-06 titer best (see enqueue_seeds.py)
compare_against: [../09_shape_aware_likelihood, ../10_denominator_rerun]   # infnum Erlang baselines
